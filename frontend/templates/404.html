{% extends "base.html" %}

{% block title %}404 - Page Not Found{% endblock %}

{% block content %}
<div class="container text-center py-5">
  <div class="card border-0 shadow-card rounded-4 p-5 max-w-500 mx-auto bg-white">
    <div class="display-1 fw-extrabold text-primary mb-2">404</div>
    <h4 class="fw-bold mb-2">Page Not Found</h4>
    <p class="text-muted small mb-4">The health resource or dashboard view you are searching for does not exist.</p>
    <a href="{{ url_for('health.dashboard_page') }}" class="btn btn-primary rounded-pill px-4">
      <i class="bi bi-arrow-left me-1"></i> Return to Dashboard
    </a>
  </div>
</div>
{% endblock %}
