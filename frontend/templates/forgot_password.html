<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - Smart Fitness & Healthcare</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
  <style>
    body {
      background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .auth-card {
      background: #fff;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-color);
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 440px;
      padding: 2.25rem;
    }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="text-center mb-4">
      <div class="brand-icon mx-auto mb-2">
        <i class="bi bi-key-fill"></i>
      </div>
      <h4 class="fw-bold mb-1">Reset Password</h4>
      <p class="text-muted small">Enter your email to receive recovery instructions</p>
    </div>

    <div id="forgotAlertBox" class="alert d-none py-2 px-3 small rounded-3" role="alert"></div>

    <form id="forgotForm">
      <div class="mb-3">
        <label class="form-label small fw-semibold">Registered Email Address</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
          <input type="email" id="forgotEmail" class="form-control border-start-0" placeholder="name@example.com" required value="demo@smartfitness.local">
        </div>
      </div>

      <button type="submit" id="forgotSubmitBtn" class="btn btn-primary w-100 rounded-pill py-2 fw-semibold shadow-sm mb-3">
        Send Reset Link
      </button>

      <div class="text-center small text-muted">
        Remembered password? <a href="{{ url_for('auth.login_page') }}" class="fw-semibold text-primary">Back to Login</a>
      </div>
    </form>
  </div>

  <script>
    document.getElementById("forgotForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("forgotEmail").value.trim();
      const alertBox = document.getElementById("forgotAlertBox");

      try {
        const res = await fetch("/api/forgot-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email })
        });
        const data = await res.json();
        if (res.ok) {
          alertBox.className = "alert alert-success py-2 px-3 small rounded-3";
          alertBox.innerHTML = `<strong>Recovery Dispatched:</strong> ${data.message} <br><a href="/reset-password?email=${encodeURIComponent(email)}" class="alert-link">Click here to set new password</a>`;
        } else {
          alertBox.className = "alert alert-danger py-2 px-3 small rounded-3";
          alertBox.textContent = data.error || "Failed to process request.";
        }
      } catch (err) {
        alertBox.className = "alert alert-danger py-2 px-3 small rounded-3";
        alertBox.textContent = "Network request failed.";
      }
    });
  </script>
</body>
</html>
