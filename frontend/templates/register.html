<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Smart Fitness & Healthcare</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
  <style>
    body {
      background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .auth-card {
      background: #fff;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-color);
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 520px;
      padding: 2.25rem;
    }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="text-center mb-4">
      <div class="brand-icon mx-auto mb-2">
        <i class="bi bi-heart-pulse-fill"></i>
      </div>
      <h4 class="fw-bold mb-1">Create Account</h4>
      <p class="text-muted small">Register for personalized fitness & health monitoring</p>
    </div>

    <!-- Alert Box -->
    <div id="registerAlertBox" class="alert d-none py-2 px-3 small rounded-3" role="alert"></div>

    <form id="registerForm">
      <div class="row g-3 mb-3">
        <div class="col-12">
          <label class="form-label small fw-semibold">Full Name</label>
          <input type="text" id="regName" class="form-control" placeholder="e.g. Jordan Reed" required>
        </div>
        <div class="col-12">
          <label class="form-label small fw-semibold">Email Address</label>
          <input type="email" id="regEmail" class="form-control" placeholder="name@example.com" required>
        </div>
        <div class="col-12">
          <label class="form-label small fw-semibold">Password (min 6 characters)</label>
          <input type="password" id="regPassword" class="form-control" placeholder="••••••••" required minlength="6">
        </div>
        <div class="col-md-4">
          <label class="form-label small fw-semibold">Age</label>
          <input type="number" id="regAge" class="form-control" placeholder="24" min="10" max="110" required value="24">
        </div>
        <div class="col-md-4">
          <label class="form-label small fw-semibold">Height (cm)</label>
          <input type="number" step="0.1" id="regHeight" class="form-control" placeholder="175" min="80" max="250" required value="175">
        </div>
        <div class="col-md-4">
          <label class="form-label small fw-semibold">Weight (kg)</label>
          <input type="number" step="0.1" id="regWeight" class="form-control" placeholder="70" min="25" max="300" required value="68.5">
        </div>
        <div class="col-12">
          <label class="form-label small fw-semibold">Gender (Optional)</label>
          <select id="regGender" class="form-select">
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="non_binary">Non-binary</option>
            <option value="prefer_not_to_say" selected>Prefer not to say</option>
          </select>
        </div>
      </div>

      <button type="submit" id="regSubmitBtn" class="btn btn-primary w-100 rounded-pill py-2 fw-semibold shadow-sm mb-3">
        <span id="regBtnText">Complete Registration</span>
        <span id="regBtnSpinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
      </button>

      <div class="text-center small text-muted">
        Already registered? <a href="{{ url_for('auth.login_page') }}" class="fw-semibold text-primary">Log In</a>
      </div>
    </form>
  </div>

  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alertBox = document.getElementById('registerAlertBox');
      const btnText = document.getElementById('regBtnText');
      const btnSpinner = document.getElementById('regBtnSpinner');
      const submitBtn = document.getElementById('regSubmitBtn');

      alertBox.className = 'alert d-none';
      btnText.classList.add('d-none');
      btnSpinner.classList.remove('d-none');
      submitBtn.disabled = true;

      const payload = {
        name: document.getElementById('regName').value.trim(),
        email: document.getElementById('regEmail').value.trim(),
        password: document.getElementById('regPassword').value,
        age: parseInt(document.getElementById('regAge').value),
        height: parseFloat(document.getElementById('regHeight').value),
        weight: parseFloat(document.getElementById('regWeight').value),
        gender: document.getElementById('regGender').value
      };

      try {
        const response = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await response.json();

        if (response.ok) {
          localStorage.setItem('smart_fitness_token', data.token);
          window.location.href = '/dashboard';
        } else {
          alertBox.className = 'alert alert-danger py-2 px-3 small rounded-3';
          alertBox.textContent = data.error || 'Registration failed.';
          btnText.classList.remove('d-none');
          btnSpinner.classList.add('d-none');
          submitBtn.disabled = false;
        }
      } catch (err) {
        alertBox.className = 'alert alert-danger py-2 px-3 small rounded-3';
        alertBox.textContent = 'Server connection failed.';
        btnText.classList.remove('d-none');
        btnSpinner.classList.add('d-none');
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
